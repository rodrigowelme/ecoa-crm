services:
  postgres:
    image: postgres:17-alpine
    container_name: ecoa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecoa
      POSTGRES_PASSWORD: ecoa_dev
      POSTGRES_DB: ecoa_crm
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ecoa -d ecoa_crm']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
